server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Slow LLM calls can leave a long gap between a parent span opening and a
  # deep child span arriving; raise the idle period well past the longest
  # expected per-child timeout (D8) so a run doesn't get flushed in pieces.
  trace_idle_period: 30s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 100000
    global:
      # Measured, not guessed (D8): raised only as far as bench runs (Phase
      # 7) actually require, tracked in docs/RESULTS.md as bytes/trace.
      max_bytes_per_trace: 8000000

metrics_generator:
  registry:
    external_labels:
      source: tempo
