[project]
name = "agenttrace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "networkx>=3.6.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "types-networkx>=3.6.1.20260903",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agenttrace"]

